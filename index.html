<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR. RAVI KUMAR PRAJAPAT - VIP PANEL</title>
    <style>
        body { background: linear-gradient(135deg, #120222, #0d1a3a); color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; }
        .header { background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 0 0 50px 50px; border-bottom: 5px solid #ff00ff; box-shadow: 0 0 20px #ff00ff; }
        .dp { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #00ffff; box-shadow: 0 0 15px #00ffff; }
        h1 { color: #d4af37; text-shadow: 2px 2px #000; margin: 10px 0; font-size: 22px; }
        .server-live { background: #000; color: #fff; border-radius: 20px; padding: 5px 15px; font-size: 11px; border: 1px solid #ff00ff; }
        
        .main-card { background: rgba(0, 0, 0, 0.8); border: 2px solid #ff007f; border-radius: 30px; padding: 20px; margin-top: 20px; max-width: 450px; margin-left: auto; margin-right: auto; }
        .token-display { background: #ffd700; color: #000; padding: 12px; border-radius: 12px; font-weight: 800; margin-bottom: 20px; border: 2px solid #000; }
        
        .btn-input { width: 100%; padding: 14px; margin: 12px 0; border-radius: 12px; outline: none; box-sizing: border-box; background: #000; color: #fff; font-weight: 600; }
        .label-tag { padding: 8px 15px; border-radius: 10px; display: inline-block; font-weight: bold; margin-bottom: -22px; position: relative; z-index: 1; font-size: 12px; text-transform: uppercase; }
        
        /* Neon Colors for Boxes */
        .color-blue { background: #00acee; border: 2px solid #00acee; }
        .color-pink { background: #ff007f; border: 2px solid #ff007f; }
        .color-purple { background: #a020f0; border: 2px solid #a020f0; }
        .color-green { background: #32cd32; border: 2px solid #32cd32; }
        .color-teal { background: #008080; border: 2px solid #008080; }
        .color-yellow { background: #ffff00; border: 2px solid #ffff00; color: #000; }

        .start-btn { background: linear-gradient(45deg, #ff00ff, #00ffff); color: #000; border: none; padding: 16px; border-radius: 15px; font-weight: 800; cursor: pointer; width: 100%; font-size: 18px; margin-top: 15px; }
        .stop-btn { background: #000; color: #fff; width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #ff0000; font-weight: bold; margin-top: 10px; }

        .status-container { border: 2px solid #ff00ff; border-radius: 20px; padding: 15px; margin-top: 25px; background: #000; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; font-size: 12px; }
        .stat-val { font-weight: 800; color: #00ffff; }

        #console { background: #000; color: #00ff00; border-radius: 15px; height: 200px; overflow-y: auto; padding: 15px; font-family: monospace; font-size: 10px; margin-top: 20px; border: 1px solid #32cd32; text-align: left; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://i.postimg.cc/4xqSYF3V/IMG-20260306-225423.png" class="dp">
        <h1>MR. RAVI KUMAR PRAJAPAT</h1>
        <div class="server-live">LIVE SINCE: {{ deploy_time }}</div>
    </div>

    <div class="main-card">
        <div class="token-display">🔑 STOP TOKEN: {{ stop_token }}</div>

        <form id="botForm">
            <span class="label-tag color-blue">🛠 METHOD</span>
            <select name="method" class="btn-input" style="border-color:#00acee;">
                <option value="token">Token Method</option>
                <option value="cookie">Cookie Method</option>
            </select>

            <span class="label-tag color-pink">🆔 TARGET ID</span>
            <input type="text" name="targetID" class="btn-input" style="border-color:#ff007f;" placeholder="Enter ID...">
            
            <span class="label-tag color-purple">👤 HATER NAME</span>
            <input type="text" name="haterName" class="btn-input" style="border-color:#a020f0;" placeholder="Enter Name...">
            
            <span class="label-tag color-green">🔑 TOKENS / COOKIES</span>
            <textarea name="authData" class="btn-input" style="border-color:#32cd32; height:80px;" placeholder="Paste data here..."></textarea>
            
            <span class="label-tag color-teal">📤 MSG FILE</span>
            <input type="file" name="msgFile" class="btn-input" style="border-color:#008080;">
            
            <span class="label-tag color-yellow">⚡ DELAY</span>
            <input type="number" name="delay" class="btn-input" style="border-color:#ffff00; color:#ffff00;" value="20">
            
            <button type="button" class="start-btn" onclick="startServer()">🚀 START ATTACK</button>
        </form>

        <div style="margin-top:20px; border-top:1px solid #333; padding-top:10px;">
            <input type="text" id="stopTokenInput" class="btn-input" style="border-color:#ff0000;" placeholder="Enter Token to Stop...">
            <button class="stop-btn" onclick="stopServer()">🛑 STOP SERVER</button>
        </div>

        <div class="status-container">
            <div style="color:#ff00ff; font-weight:bold; margin-bottom:10px;">❈══ RK-PRAJAPAT LIVE ══❈</div>
            <div class="status-grid">
                <div>Active: <span class="stat-val" id="active">0</span></div>
                <div>Uptime: <span class="stat-val" id="uptime">0d 0h 0m</span></div>
                <div>Sent: <span class="stat-val" id="sent">0</span></div>
                <div>Failed: <span class="stat-val" id="failed">0</span></div>
            </div>
        </div>
        <div id="console">Ready...</div>
    </div>

    <script>
        async function startServer() {
            const formData = new FormData(document.getElementById('botForm'));
            const res = await fetch('/start', { method: 'POST', body: formData });
            if(res.ok) alert("Attack Started!");
        }

        async function stopServer() {
            const token = document.getElementById('stopTokenInput').value;
            const res = await fetch('/stop', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `stopToken=${encodeURIComponent(token)}`
            });
            if(res.ok) alert("Stopped!"); else alert("Wrong Token!");
        }

        setInterval(async () => {
            const res = await fetch('/get-status');
            const data = await res.json();
            document.getElementById('active').innerText = data.active;
            document.getElementById('sent').innerText = data.sent;
            document.getElementById('failed').innerText = data.failed;
            document.getElementById('uptime').innerText = data.uptime;
            if(data.logs.length > 0) {
                document.getElementById('console').innerHTML = data.logs.map(l => `[${l.time}] ${l.status}: ${l.msg.substring(0,20)}...`).reverse().join('<br>');
            }
        }, 3000);
    </script>
</body>
</html>
